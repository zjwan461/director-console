# GPT Image 2 示例提示词
# 前端读取后最多展示 10 条。新增条目按下面格式追加即可。
# 字段：
#   id        两位序号，用于排序与芯片展示
#   name      短标题，显示在提示词上方的示例条
#   subtitle  补充说明（可选）
#   color     芯片颜色：violet/rose/amber/orange/sky/emerald/fuchsia/indigo/teal/lime
#   prompt    写入提示词框的正文（必填，按自然段落换行）
prompts:
  - id: "01"
    name: 国漫3D人物4视图
    subtitle: 用于生成国漫3D人物四视图设定
    color: fuchsia
    prompt: |-
      高精度3D写实国漫，精致BJD人偶感少女，未来感Y2K千禧时尚，赛博甜酷少女，高级游戏角色建模质感。女性，约20岁，身高190cm，高挑九头身比例，宽肩窄腰，纤细修长身材，腰线高，胯部自然，腿部占身体比例约三分之二，腿型笔直修长，头部偏小，肩颈舒展，拒绝大头娃娃比例，拒绝短腿、短躯干、五五身，身材比例不可压缩。

      浅象牙冷白瓷肌，白皙通透、细腻无暇，弱化真实皮肤毛孔，保留高级3D瓷肌质感。精致小鹅蛋脸，脸型窄而流畅，下颌线清晰，下巴小巧微尖但不过长；精致BJD五官，大而狭长的杏仁猫眼，灰蓝紫色玻璃感瞳孔，明显高光，长卷翘睫毛，灰紫色与冰蓝色渐变眼影，眼尾轻微上挑，精细黑色眼线，下眼脸淡紫色晕染，轻微卧蚕；细长自然眉形，高挺窄直鼻梁，小巧鼻头，精致小嘴，淡灰粉水润果冻唇，整体冷艳、精致、甜酷。

      银灰浅亚麻色长发，发量浓密，柔顺自然，高双马尾造型，两侧马尾对称垂落至腰部附近，发丝细腻有层次，头顶蓬松自然，中分偏自然碎发，额前两侧留少量轻薄修饰脸型的发丝；双马尾根部使用银色水晶链、金属环、透明水晶发饰固定，未来感但不过度复杂。

      服装为高级未来Y2K甜酷风：浅冰蓝色短款亮面飞行夹克，修身短款版型，露出纤细腰部，冰蓝珍珠光泽面料，衣身带细致金属拉链、银色五金、透明PVC拼接和少量未来感装饰结构；内搭淡薰衣草紫修身短款束腰胸衣，立体裁片结构，细腻缎面与微光材质，胸衣中央带精致银色拉链与小型金属装饰。

      下装为高腰银白色镭射幻彩宽松长裤，珍珠银、冰蓝、淡紫色偏光效果，面料具有高级全息反射质感，腰部增加银色金属扣、透明腰带、细链条及小型水晶挂饰，裤型高腰、臀胯自然贴合后向下形成宽松直筒轮廓，裤腿必须非常修长，避免堆积造成腿短。

      脚穿白色未来感厚底系带短靴，银色五金装饰，鞋底有一定高度但比例自然。佩戴多层银色金属项链、精致锁骨链、未来感金属Choker、水晶吊坠、冰蓝紫透明水晶长耳坠、耳骨夹与少量银色耳饰，首饰精致、有层次但不要堆砌杂乱。

      女人物4视图角色设定图，横向16:9构图。从左至右严格排列：左侧第一部分：同一人物超高清正脸面部特写，右侧并列展示同一人物三个全身视图：正面全身照，标准90度侧面全身照，标准180度背面全身照。

      四个视图必须为完全同一位女性。左侧面部特写作为人物身份基准，右侧正面、侧面、背面的人物脸型、五官比例、瞳色、妆容、肤色、发色、发型、双马尾长度、发饰、服装款式、面料、首饰、腰带、鞋子全部完全一致，不得出现不同人物，不得改变服装结构，不得改变发型。

      重点强化：190cm超模身高感，严格九头身，头部占比小，肩线舒展，腰线偏高，腿根位置高，大腿和小腿都必须充分拉长，脚底完整入镜，全身人物上下留少量安全边距，不允许为了塞入画面而纵向压缩身体，不允许缩短腿部，不允许扩大头部。

      浅灰色纯色无缝影棚背景，干净简洁，无家具，无场景杂物，无文字，无Logo，无水印。85mm人像镜头，f/2.0大光圈质感，影棚级柔光，电影级商业时装布光，柔和冷色主光，细腻轮廓光，金属、水晶、缎面、镭射PVC材质清晰真实，高级时装大片质感，高精度3D建模，超高清，8K，细节锐利，真实摄影质感与精致国漫CG质感融合。
  - id: "02"
    name: 仙侠古装人物设定
    subtitle: 用于生成仙侠古装人物的提示词
    color: violet
    prompt: |-
      8K超高清专业古装人像摄影，精修真人电影海报质感，真实皮肤纹理，柔和自然磨皮，绝对无二次元插画感，无CG数字人感，无塑料假人感。

      东方玄幻仙侠影视女主角色海报，黑莲圣女，危险清醒，看似21岁，正邪反转角色。

      五官清秀有辨识度，鹅蛋脸或小方脸自然真实，眉形干净，鼻梁柔和立体，唇色自然，气质有古装短剧女主级清透感。

      眼睛是画面重点，眼神机敏清亮，瞳孔有湿润反光，带迅速判断局势的聪慧与警觉。

      皮肤干净通透，保留轻微真实毛孔、细小瑕疵与自然肤质纹理，避免瓷娃娃式磨皮。

      东方仙侠发髻或半束长发造型，发簪、步摇、额饰、发链或面纱与服饰设定呼应，发丝自然真实，轻盈但不飘乱。

      身着玄紫轻甲长裙，服装完整可见，版型符合东方玄幻仙侠服饰结构，衣领、广袖、窄袖、腰封、护腕、披帛、裙摆、鞋履和发饰细节清晰；面料呈现法袍、仙裙、鹤氅、鲛绡、轻甲、皮革、玉石、金属、灵纹刺绣或半透明纱料的真实质感，颜色与身份气质统一，带影视级仙侠角色定板审美与阶层细节。

      半身到七分身人像，服装完整可见，手部自然放松，身体微微前倾，像正在捕捉关键线索。鬼市长街、黄泉渡口、冥河雾岸、幽暗莲池或魔佛殿前虚化背景，背景有仙山云海、宗门殿宇、灵雾、法阵光纹、洞府、星河、冥河、妖族秘境或异界长街细节但不过分抢镜；浅景深电影布光，自然窗光、烛光或阴天柔光，人物面部和眼睛清晰锐利，画面真实、克制、耐看。

      剧情气质：危险清醒正邪反转角色。

      将这个人物作为主体，生成8K超高清分辨率，印刷级锐利细节，工业级角色模型多角度展示规范，采用干净、中性纯色背景(低饱和浅灰，无杂色、无渐变、无纹理)，整体呈现专业影视角色技术模型多角度展示图，完全统一的写实度(超写实真人级还原皮肤肌理、毛发质感、衣料纹理真实触感)、同款影视级PBR渲染方式(Physically BasedRendering，物理级光照反射，还原真实材质反光、折射效果)、一致的纹理精度(4K材质纹理，每一寸细节清晰可辨)、统一的影视级色彩处理(低饱和高对比度，色调统一，无偏色、无过度调色)、一致的整体视觉美感(简约专业，符合影视角色定板规范，无多余装饰)。

      画面严格按指定分区排版，布局规整、间距均匀、视图分隔干净利落，无重叠、无偏移，所有视图角色身份完全一致，各视图间比例精准统一、对齐方式规范，人体解剖结构精准无误(肌肉线条、骨骼轮廓、肢体比例完全符合真人生理结构)，角色轮廓清晰锐利，边缘无模糊、无虚化。

      1.画面左侧区域:横向并排，排列两个全身站姿视图，均以标准放松A字站姿呈现，严格遵循固定顺序:正面全身视图(站姿端正，四肢自然下垂，身体对称，无多余动作)、背面全身视图(完整呈现背部轮廓、发型全貌、背部服饰细节，站姿与正面、左侧面保持一致);两个全身视图的构图框架大小统一、头部高度完全对齐，身形比例精准同步。

      2.画面中间区域：正视图面部特写(完整呈现五官轮廓、眼瞳细节、睫毛纹理、皮肤肌理、唇纹、面部微表情无遮挡)

      3.画面右侧区域:横向排列两幅超高细节影视级面部特写肖像，与左侧上排全身视图精准对齐，严格遵循固定顺序:左视图面部特写(面朝左，清晰呈现左侧面部轮廓、侧脸线条、耳型细节、鬓角毛发)、右视图面部特写(面朝右，清晰呈现右侧面部轮廓、五官侧面形态);两幅肖像面部比例完全一致，五官大小、位置精准对应，皮肤质感、毛发细节与全身视图统一，无任何偏差。

      4.画面右下角区域:分为上下两排，共4幅超高细节特写图，排版规整，与右上角肖像间距均匀，细节锐利可辨:上排2张为服饰细节及鞋子细节特写(分别为腰带核心细节特写、鞋子完整细节特写，清晰呈现衣料纹理、针脚细节、布料褶皱、纽扣/拉链质感、鞋子材质、鞋纹细节、鞋饰细节，还原真实衣料触感与鞋子质感);下排2张为发饰装饰品、细节特写(分别为发饰整体细节特写、发饰局部精细特写、清晰呈现发饰材质、花纹、镶嵌物细节，无任何细节丢失)。

      全图所有视图光照效果完全统一，光照方向、光照强度、光线柔和度保持一致(采用影视级柔光打光，光线均匀，无强烈明暗对比)，使用自然且可控的柔和阴影，阴影层次清晰，既能突出角色轮廓与细节，又不遮挡任何纹理与结构，避免营造强烈的情绪反差，贴合影视角色定板的专业、客观需求。

      整体画面干净整洁、专业规范，细节极致锐利，无文字、无水印、无LOGO、无多余杂物，输出效果可直接用于影视角色建模、服装制作、印刷定板，完全符合影视级角色参考标准。
