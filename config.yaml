app:
  host: 127.0.0.1
  port: 6006

# ComfyUI 连接方式：local（本机启动，默认）| ssh（远程机）| external（已有服务）| mock（无显卡跑通链路）
comfy:
  mode: local
  base_url: http://127.0.0.1:8188
  # 本地 ComfyUI 的固定地址：服务管家卡片只探测这个地址
  local_url: http://127.0.0.1:8188
  timeout: 30
  # 是否读取系统代理（HTTP_PROXY/HTTPS_PROXY）。云端地址走公司代理时改成 true；
  # 本机/局域网直连建议 false，避免代理配置异常导致连不上。
  trust_env: false

  local:
    # Windows 开发示例：D:/ComfyUI_windows_portable/ComfyUI
    # Linux 示例：/root/ComfyUI
    workdir: D:/ComfyUI
    python: python
    args: ["main.py", "--listen", "127.0.0.1", "--port", "8188"]
    env:
      # CUDA_VISIBLE_DEVICES: "0"
      # PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

  ssh:
    host: ""
    port: 22
    user: root
    start: "bash /root/ComfyUI/start.sh"
    stop: "pkill -f 'python.*main.py'"
    status: "pgrep -f 'python.*main.py' | head -n1"
    log: "tail -n 200 /root/ComfyUI/comfyui.log"

# 成片导出（M3）。ffmpeg 不在 PATH 时填绝对路径，例如 D:/tools/ffmpeg/bin/ffmpeg.exe
ffmpeg:
  path: ""
  crf: "20"
  preset: "medium"

# 提示词助手（OpenAI 兼容接口）。留空则界面只提示、不调用。
ai:
  base_url: https://www.autodl.art/api/v1
  api_key: ""
  model: "DeepSeek-V4.1-Flash"
  # 调用提示词模型时是否读取系统代理；公司代理环境才需要 true
  trust_env: false
  # 也可直接指定代理（推荐写进 config.local.yaml）：http://host:port
  proxy: ""

models:
  # 下载命令里的 ComfyUI 根目录：留空则产出 models/<category>/<file>
  comfy_root: ""
  # curl --limit-rate，留空不限速
  limit_rate: "50m"
  download_base: ""

ui:
  # 旧面板 / ComfyUI 作为「高级模式」入口，填了才显示
  advanced_panel: ""
  comfy_web: "http://127.0.0.1:8188"
