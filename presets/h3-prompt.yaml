    bind: "1:image"
    type: image
    label: 参考图 1
  - key: ref_2
    bind: "2:image"
    type: image
    label: 参考图 2
  - key: ref_3
    bind: "3:image"
    type: image
    label: 参考图 3
  - key: ref_4
    bind: "4:image"
    type: image
    label: 参考图 4
  - key: ref_5
    bind: "5:image"
    type: image
    label: 参考图 5
  - key: ref_6
    bind: "6:image"
    type: image
    label: 参考图 6
  - key: ref_7
    bind: "7:image"
    type: image
    label: 参考图 7
  - key: ref_8
    bind: "8:image"
    type: image
    label: 参考图 8
  - key: ref_9
    bind: "9:image"
    type: image
    label: 参考图 9
  - key: prompt
    bind: "15:提示词"
    type: textarea
    label: 你想拍什么
    rows: 8
    required: true
    placeholder: 例：图1的女主在雪夜走进寺庙，遇到图2的男主，两人对话，最后镜头推到屋檐的铜铃
