id: h3.prompt
name: 提示词台
badge: 只出文本
category: text
output_kind: text
order: 12
desc: 把一句人话扩写成 H3 的六段式分镜词，只出文本、不出视频。
hint: 先在这里写词，再把结果贴进「多参考 / 九图」卡的描述框。参考图可传可不传。
workflow: API-U00-minimax_h3提示词QWEN3.8群主版.json
timeout: 1800
placeholders:
  image: blank-image.png
  video: blank-video.mp4
  audio: blank-audio.mp3
fields:
