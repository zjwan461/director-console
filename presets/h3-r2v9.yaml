id: h3.r2v9
name: 九图多参考 + 配音
badge: 进阶
category: video
output_kind: video
order: 50
desc: 最多 9 张参考图 + 3 段参考音频，适合角色多、镜头复杂或有对白/旁白的段落。
hint: 只传用得上的前几张即可，其余空位会自动补白；参考视频容易爆显存，这里暂不开放。
workflow: API-U06V9-9图3音.json
timeout: 5400
placeholders:
  image: blank-image.png
  video: blank-video.mp4
  audio: blank-audio.mp3
fields:
  - key: ref_1
    bind: "3892:ref_image_0"
    type: image
    label: 参考图 1
    required: true
  - key: ref_2
    bind: "3892:ref_image_1"
    type: image
    label: 参考图 2
  - key: ref_3
    bind: "3892:ref_image_2"
    type: image
    label: 参考图 3
  - key: ref_4
    bind: "3892:ref_image_3"
    type: image
    label: 参考图 4
  - key: ref_5
    bind: "3892:ref_image_4"
    type: image
    label: 参考图 5
  - key: ref_6
    bind: "3892:ref_image_5"
    type: image
    label: 参考图 6
  - key: ref_7
    bind: "3892:ref_image_6"
    type: image
    label: 参考图 7
  - key: ref_8
    bind: "3892:ref_image_7"
    type: image
    label: 参考图 8
  - key: ref_9
    bind: "3892:ref_image_8"
    type: image
    label: 参考图 9
  - key: audio_1
    bind: "3892:ref_audio_0"
    type: audio
    label: 参考音频 1（音色/对白）
  - key: audio_2
    bind: "3892:ref_audio_1"
    type: audio
    label: 参考音频 2
  - key: audio_3
    bind: "3892:ref_audio_2"
    type: audio
    label: 参考音频 3
  - key: prompt
    bind: "3892:prompt"
    type: textarea
    label: 分镜描述（六段式）
    rows: 12
    required: true
    assist: r2v
    placeholder: 可用「提示词助手」把一句话扩写成 subject_definitions / summary / detailed_description 六段式
  - key: size
    type: size
    label: 画幅
    mode: aspect_mp
    aspect: "3892:aspect_ratio"
    megapixels: "3892:megapixels"
    default_aspect: "16:9"
    default_megapixels: 0.7
  - key: duration
    bind: "3892:seconds"
    type: duration
    label: 时长（秒）
    default: 10
    min: 3
    max: 15
