id: h3.u24
name: 双采高动态（U24）
badge: 高动态
category: video
output_kind: video
order: 56
desc: 文武双修 T8 双时钟，一采保动态、二采保细节；九图 + 三音频。
hint: 一采默认 0.4MP，别拉高；二采倍率 1.5 起步，显存不够就降到 1.2。参考视频容易爆显存，这里不开放。
workflow: API-U24-文武双修T8版.json
timeout: 5400
placeholders:
  image: blank-image.png
  video: blank-video.mp4
  audio: blank-audio.mp3
fields:
  - key: ref_1
    bind: "66:image"
    type: image
    label: 参考图 1
    required: true
  - key: ref_2
    bind: "65:image"
    type: image
    label: 参考图 2
  - key: ref_3
    bind: "58:image"
    type: image
    label: 参考图 3
  - key: ref_4
    bind: "59:image"
    type: image
    label: 参考图 4
  - key: ref_5
    bind: "60:image"
    type: image
    label: 参考图 5
  - key: ref_6
    bind: "61:image"
    type: image
    label: 参考图 6
  - key: ref_7
    bind: "62:image"
    type: image
    label: 参考图 7
  - key: ref_8
    bind: "63:image"
    type: image
    label: 参考图 8
  - key: ref_9
    bind: "64:image"
    type: image
    label: 参考图 9
  - key: audio_1
    bind: "107:audio"
    type: audio
    label: 参考音频 1
  - key: audio_2
    bind: "108:audio"
    type: audio
    label: 参考音频 2
  - key: audio_3
    bind: "109:audio"
    type: audio
    label: 参考音频 3
  - key: prompt
    bind: "28:prompt"
    type: textarea
    label: 分镜描述
    rows: 12
    required: true
    assist: r2v
    placeholder: 打斗/连续动作镜头，建议用六段式写清每镜的动作与镜头运动
  - key: size
    type: size
    label: 一采画幅
    mode: aspect_mp
    aspect: "29:aspect_ratio"
    megapixels: "29:megapixels"
    default_aspect: "16:9"
    default_megapixels: 0.4
  - key: duration
    bind: "27:value"
    type: duration
    label: 时长（秒）
    default: 10
    min: 3
    max: 15
  - key: upscale
    bind: "54:value"
    type: number
    label: 二采倍率
    default: 1.5
  - key: seed
    bind: "11:noise_seed"
    type: seed
    label: 随机种子
